[package]
name = "server"
version = "0.2.0"
edition = "2018"

[dependencies]
actix-web = "4.9"
tokio = { version = "1.41.0", features = ["full"] }
tokio-postgres = "0.7.12"
deadpool-postgres = "0.14.0"
openssl = { version = "0.10.68", features = ["vendored"] }
dotenvy = "0.15.7"
env_logger = "0.11.5"
async-trait = "0.1.83"
log = "0.4.22"

[dev-dependencies]
serde_json = "1.0.132"

[[bin]]
name = "server"
path = "src/main.rs"