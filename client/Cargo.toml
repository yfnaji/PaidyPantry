[package]
name = "client"
version = "0.2.0"
edition = "2018"

[dependencies]
reqwest = { version = "0.12.9", features = ["blocking", "json"] }
tokio = { version = "1.41.0", features = ["full"] }
openssl = { version = "0.10.68", features = ["vendored"] }
polars = "0.44.2"
rand = "0.8.5"

[[bin]]
name = "client"
path = "src/main.rs"